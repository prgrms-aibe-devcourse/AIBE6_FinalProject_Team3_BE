services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'   # t3.small 디스크 감안, 보관기간 짧게
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # monitoring/metrics_scrape_token은 git엔 로컬 기본값만 커밋돼 있고, 배포 시 deploy.yml이
      # .env의 실제 METRICS_SCRAPE_TOKEN 값으로 덮어써서 맞춘다(Prometheus가 파일 내용을 그대로
      # 토큰으로 읽으므로 이 파일 자체엔 주석을 넣을 수 없음 - 설명은 monitoring/prometheus.yml
      # 참고).
      - ./monitoring/metrics_scrape_token:/etc/prometheus/secrets/metrics_scrape_token:ro
      - prometheus-data:/prometheus
    networks:
      - algogyeyak-network
    restart: unless-stopped
    # ports 노출 안 함 — 내부 네트워크에서만 접근

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD를 .env에 설정해야 합니다 - 비워두면 Grafana 기본 관리자 비밀번호(admin)가 그대로 남습니다}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - algogyeyak-network
    restart: unless-stopped
    # ports 노출 안 함 — NPM이 내부 네트워크로 proxy

  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"   # 인터넷에는 노출 안 함 - 다른 PC의 k6는 SSH 터널로 접속
    environment:
      - INFLUXDB_HTTP_AUTH_ENABLED=false
      - INFLUXDB_DB=k6
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - algogyeyak-network

volumes:
  prometheus-data:
  grafana-data:
  influxdb-data: