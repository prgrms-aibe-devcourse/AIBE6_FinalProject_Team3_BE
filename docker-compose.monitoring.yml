services:
  prometheus:
    # :latest는 재기동할 때마다 다른 버전이 조용히 올라올 수 있어(호환성 깨짐/보안 리그레션 위험)
    # 특정 릴리스에 고정한다 - 실제 운영 중인 버전과 다르면 확인 후 맞춰서 올릴 것.
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'   # t3.small 디스크 감안, 보관기간 짧게
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - algogyeyak-network
    restart: unless-stopped
    # ports 노출 안 함 — 내부 네트워크에서만 접근

  grafana:
    # :latest는 재기동할 때마다 다른 버전이 조용히 올라올 수 있어(호환성 깨짐/보안 리그레션 위험)
    # 특정 릴리스에 고정한다 - 실제 운영 중인 버전과 다르면 확인 후 맞춰서 올릴 것.
    image: grafana/grafana:11.3.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD를 .env에 설정해야 합니다 - 비워두면 Grafana 기본 관리자 비밀번호(admin)가 그대로 남습니다}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - algogyeyak-network
    restart: unless-stopped
    # ports 노출 안 함 — NPM이 내부 네트워크로 proxy

  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"   # 인터넷에는 노출 안 함 - 다른 PC의 k6는 SSH 터널로 접속
    environment:
      - INFLUXDB_HTTP_AUTH_ENABLED=false
      - INFLUXDB_DB=k6
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - algogyeyak-network

volumes:
  prometheus-data:
  grafana-data:
  influxdb-data: