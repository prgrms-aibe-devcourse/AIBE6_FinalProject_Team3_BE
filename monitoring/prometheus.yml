global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-backend'
    metrics_path: '/actuator/prometheus'
    # /actuator/prometheus는 MetricsScrapeTokenFilter(backend)가 이 값을 검사한다(공유 비밀 -
    # backend/.env의 METRICS_SCRAPE_TOKEN과 반드시 같아야 함). Prometheus 자체는 이 YAML 안에서
    # ${VAR} 치환을 지원하지 않으므로(docker-compose 파일과 다름), 토큰 문자열을 여기 직접 적는
    # 대신 별도 파일(bearer_token_file)을 가리킨다 - 그래야 이 파일(prometheus.yml)은 git에 안전하게
    # 커밋해두고, monitoring/metrics_scrape_token 파일(git엔 로컬 기본값만 커밋돼 있음, 그 파일
    # 자체엔 토큰 원문만 들어가야 해서 주석을 못 둠) 하나만 배포 시 deploy.yml(.github/workflows/deploy.yml)이
    # .env의 실제 METRICS_SCRAPE_TOKEN 값으로 덮어써서 맞춘다.
    bearer_token_file: /etc/prometheus/secrets/metrics_scrape_token
    static_configs:
      - targets: ['algogyeyak-backend:8080']  # docker-compose.yml의 backend 서비스명과 일치해야 함