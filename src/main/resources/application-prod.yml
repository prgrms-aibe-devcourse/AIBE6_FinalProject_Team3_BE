spring:
  application:
    name: algogyeyak
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
  # H2 콘솔은 로컬 개발 편의용. 운영에서 인증 없이 DB 콘솔이 열려 있으면 안 되므로 명시적으로 끈다.
  h2:
    console:
      enabled: false

# 운영에서 API 문서/Swagger UI를 통해 전체 엔드포인트 구조가 노출되지 않도록 끈다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 운영 프로필: dummy 기본값을 제공하지 않아, 아래 환경변수가 없으면 기동 자체가 실패한다 (fail-fast).
app:
  jwt:
    secret: ${JWT_SECRET}
  oauth2:
    state-signing-key: ${OAUTH2_STATE_SIGNING_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  cookie:
    secure: ${COOKIE_SECURE:true}
    # 배포 전략은 시나리오 C(프론트 Vercel / 백엔드 EC2, 도메인 공유 없음)로 확정됐지만(README.md의
    # "운영 배포 시 쿠키 설정" 표 참고), 기본값 자체는 보수적으로 Lax를 유지한다 - 시나리오 A/B로
    # 배포하는 팀원이 이 기본값을 모르고 그대로 쓰면 불필요하게 느슨한 SameSite=None이 적용되는
    # 걸 막기 위함. 실제 배포(시나리오 C) 시에는 COOKIE_SAME_SITE=None을 환경변수로 명시할 것 -
    # SameSite=None은 반드시 Secure=true와 함께 가야 하며(CookieUtils가 기동 시점에 이를 강제한다),
    # COOKIE_DOMAIN은 어차피 서로 다른 등록 도메인이라 맞출 수 없으므로 비워둔다(host-only).
    same-site: ${COOKIE_SAME_SITE:Lax}
    domain: ${COOKIE_DOMAIN:}
  # 개발 편의용 로그인 우회 기능은 운영에서 절대 켜지면 안 되므로, 환경변수를 참조하지 않고
  # 값 자체를 고정한다 — 배포 환경에 DEV_LOGIN_ENABLED=true가 잘못 설정돼도 이 값이 이긴다.
  dev-login:
    enabled: false
