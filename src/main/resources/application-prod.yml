spring:
  application:
    name: algogyeyak
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
  # H2 콘솔은 로컬 개발 편의용. 운영에서 인증 없이 DB 콘솔이 열려 있으면 안 되므로 명시적으로 끈다.
  h2:
    console:
      enabled: false

# 운영에서 API 문서/Swagger UI를 통해 전체 엔드포인트 구조가 노출되지 않도록 끈다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 운영 프로필: dummy 기본값을 제공하지 않아, 아래 환경변수가 없으면 기동 자체가 실패한다 (fail-fast).
app:
  jwt:
    secret: ${JWT_SECRET}
  oauth2:
    state-signing-key: ${OAUTH2_STATE_SIGNING_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  cookie:
    secure: ${COOKIE_SECURE:true}
    # SAME_SITE/DOMAIN 값은 배포 도메인 전략(커스텀 서브도메인 / Vercel rewrite / 도메인 공유 없음)에
    # 따라 완전히 달라진다 — README.md의 "운영 배포 시 쿠키 설정" 표 참고 후 확정할 것.
    same-site: ${COOKIE_SAME_SITE:Lax}
    domain: ${COOKIE_DOMAIN:}
  # 개발 편의용 로그인 우회 기능은 운영에서 절대 켜지면 안 되므로, 환경변수를 참조하지 않고
  # 값 자체를 고정한다 — 배포 환경에 DEV_LOGIN_ENABLED=true가 잘못 설정돼도 이 값이 이긴다.
  dev-login:
    enabled: false
