spring:
  application:
    name: algogyeyak
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
  # H2 콘솔은 로컬 개발 편의용. 운영에서 인증 없이 DB 콘솔이 열려 있으면 안 되므로 명시적으로 끈다.
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update  # TODO: Flyway/Liquibase 전환 전까지 임시조치

# 운영에서 API 문서/Swagger UI를 통해 전체 엔드포인트 구조가 노출되지 않도록 끈다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 운영 프로필: dummy 기본값을 제공하지 않아, 아래 환경변수가 없으면 기동 자체가 실패한다 (fail-fast).
app:
  jwt:
    secret: ${JWT_SECRET}
  oauth2:
    # application.yml의 기본값(http://localhost:3000/oauth/callback)을 여기서 없애지 않으면,
    # 운영 배포 시 OAUTH2_REDIRECT_URI를 깜빡해도 기동은 성공하고 구글/카카오 로그인 성공 후
    # 브라우저가 조용히 localhost:3000으로 리다이렉트된다 - JWT_SECRET 등 다른 값들과 같은
    # 이유로 기본값 자체를 없애 배포 시 반드시 명시하도록 강제한다.
    authorized-redirect-uri: ${OAUTH2_REDIRECT_URI}
    state-signing-key: ${OAUTH2_STATE_SIGNING_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  cookie:
    secure: ${COOKIE_SECURE:true}
    # 배포 전략은 시나리오 C(프론트 Vercel / 백엔드 EC2, 도메인 공유 없음)로 확정됐다(README.md의
    # "운영 배포 시 쿠키 설정" 표 참고). Lax/None 어느 쪽을 기본값으로 둬도 실수로 잘못된 시나리오에
    # 배포될 위험이 남는다 - Lax를 기본값으로 두면 시나리오 C에 이 값을 빠뜨렸을 때 로그인이 조용히
    # 깨지고, None을 기본값으로 두면 반대로 시나리오 A/B에 배포할 때 불필요하게 느슨해진다. 그래서
    # JWT_SECRET/OAUTH2_STATE_SIGNING_KEY/CORS_ALLOWED_ORIGINS와 같은 패턴으로 기본값 자체를 없애
    # 배포 시 반드시 명시하도록 강제한다 - 빠뜨리면 기동 자체가 실패해(PlaceholderResolutionException)
    # 어느 쪽으로도 조용히 잘못 뜨는 상황을 막는다. SameSite=None은 반드시 Secure=true와 함께 가야
    # 하며(CookieUtils가 기동 시점에 이를 강제한다), COOKIE_DOMAIN은 어차피 서로 다른 등록 도메인이라
    # 맞출 수 없으므로 비워둔다(host-only).
    same-site: ${COOKIE_SAME_SITE}
    domain: ${COOKIE_DOMAIN:}
  # 개발 편의용 로그인 우회 기능은 운영에서 절대 켜지면 안 되므로, 환경변수를 참조하지 않고
  # 값 자체를 고정한다 — 배포 환경에 DEV_LOGIN_ENABLED=true가 잘못 설정돼도 이 값이 이긴다.
  dev-login:
    enabled: false
