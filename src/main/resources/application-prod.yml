spring:
  application:
    name: algogyeyak
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
  # H2 콘솔은 로컬 개발 편의용. 운영에서 인증 없이 DB 콘솔이 열려 있으면 안 되므로 명시적으로 끈다.
  h2:
    console:
      enabled: false

# 운영에서 API 문서/Swagger UI를 통해 전체 엔드포인트 구조가 노출되지 않도록 끈다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 운영 프로필: dummy 기본값을 제공하지 않아, 아래 환경변수가 없으면 기동 자체가 실패한다 (fail-fast).
app:
  jwt:
    secret: ${JWT_SECRET}
  oauth2:
    state-signing-key: ${OAUTH2_STATE_SIGNING_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  cookie:
    secure: ${COOKIE_SECURE:true}
    # 프론트(Vercel)/백엔드(EC2)가 같은 origin으로 보이도록 맞추는 배포 구조(Vercel rewrite 또는
    # 커스텀 서브도메인 + Domain=.example.com)라면 Lax로 충분하다. 그 구조를 포기하고 완전히
    # 다른 도메인으로 그대로 배포한다면 SameSite=None으로 바꿔야 하는데, 그 경우에도 쿠키의
    # Domain이 백엔드 호스트로 고정돼 있어 프론트 미들웨어(proxy.ts)가 여전히 쿠키를 못 보는
    # 문제는 SameSite와 별개로 남는다 — 배포 구조를 먼저 정하고 반영할 것.
    same-site: ${COOKIE_SAME_SITE:Lax}
    # 커스텀 서브도메인(app.example.com/api.example.com)으로 배포하면 .example.com처럼 넣어야
    # 서브도메인 간에 쿠키가 공유된다. 아직 정해지지 않았으면 비워둔다(host-only, 지금과 동일).
    domain: ${COOKIE_DOMAIN:}
