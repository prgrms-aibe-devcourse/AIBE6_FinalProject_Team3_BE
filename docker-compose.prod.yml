services:
  backend:
    image: ghcr.io/prgrms-aibe-devcourse/algogyeyak-backend:latest
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports:
      - "127.0.0.1:8080:8080"

  nginx-proxy-manager:
    # :latest는 재기동할 때마다 다른 버전이 조용히 올라올 수 있어(호환성 깨짐/보안 리그레션 위험)
    # 특정 릴리스에 고정한다 - 실제 운영 중인 버전과 다르면 확인 후 맞춰서 올릴 것.
    image: 'jc21/nginx-proxy-manager:2.11.3'
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - algogyeyak-network

volumes:
  npm-data:
  npm-letsencrypt:

networks:
  algogyeyak-network:
    external: true