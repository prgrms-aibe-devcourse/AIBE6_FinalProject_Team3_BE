name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - run: ./gradlew test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: EC2 접속 후 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            cd ~/algogyeyak/backend
            git pull origin main
            # docker-compose.prod.yml이 algogyeyak-network를 external: true로 참조하므로,
            # 이 네트워크가 없는 새 인스턴스(재해복구 등)에서도 최초 배포가 실패하지 않도록
            # 없을 때만 생성한다(이미 있으면 아무 것도 하지 않음 - 기존 운영 환경엔 영향 없음).
            docker network inspect algogyeyak-network >/dev/null 2>&1 || docker network create algogyeyak-network
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d --build
