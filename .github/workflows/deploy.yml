name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - run: ./gradlew test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: EC2 접속 후 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            cd ~/algogyeyak/backend
            git pull origin main
            # docker-compose.prod.yml이 algogyeyak-network를 external: true로 참조하므로,
            # 이 네트워크가 없는 새 인스턴스(재해복구 등)에서도 최초 배포가 실패하지 않도록
            # 없을 때만 생성한다(이미 있으면 아무 것도 하지 않음 - 기존 운영 환경엔 영향 없음).
            docker network inspect algogyeyak-network >/dev/null 2>&1 || docker network create algogyeyak-network
            # --build를 반복 실행할 때마다 이전 빌드 캐시(멀티스테이지의 AS build 스테이지 - JDK +
            # Gradle 의존성 캐시라 용량이 큼)와 더 이상 참조되지 않는 dangling 이미지가 쌓이는데,
            # 이걸 정리하는 로직이 원래 없었다. t3.small처럼 디스크가 넉넉하지 않은 인스턴스에서는
            # 이게 누적돼 디스크가 꽉 차고, 그 상태에서는 빌드가 멈추는 것을 넘어 SSH 접속 자체가
            # 안 되는 상황까지 겪었다(2026-08-14) - 빌드 전에 정리해 재발을 막는다. 현재 실행 중인
            # 컨테이너가 쓰는 이미지/레이어는 "사용 중"으로 간주돼 지워지지 않으므로 안전하다.
            docker builder prune -af
            docker image prune -af
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d --build
